<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅の軌跡マップ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hiragino Kaku Gothic Pro", "メイリオ", Meiryo, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* オーバーレイパネル */
        .overlay-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            padding: 14px;
            max-width: 320px;
            width: calc(100vw - 20px);
            font-size: 14px;
        }

        .overlay-panel h1 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #666;
            padding: 0 4px;
        }

        .panel-body {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.3s ease;
            max-height: 500px;
            opacity: 1;
        }

        .panel-body.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .input-group {
            margin-bottom: 8px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 2px;
        }

        .input-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #4285f4;
        }

        .btn-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            padding: 8px 6px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            min-width: 0;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #4285f4;
            color: #fff;
        }

        .btn-success {
            background: #34a853;
            color: #fff;
        }

        .btn-route {
            background: #ea4335;
            color: #fff;
        }

        .btn-all {
            background: #ff6d00;
            color: #fff;
        }

        .mode-btns {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }

        .mode-btns .btn {
            flex: 1;
            padding: 8px 4px;
            font-size: 12px;
            border: 2px solid transparent;
        }

        .mode-btns .btn.active {
            border-color: #333;
            box-shadow: 0 0 0 1px #333;
        }

        .info-text {
            font-size: 12px;
            color: #555;
            margin-top: 4px;
            min-height: 18px;
        }

        .info-text.error {
            color: #ea4335;
        }

        .info-text.success {
            color: #34a853;
        }

        /* ローディング */
        .loading {
            display: none;
            text-align: center;
            padding: 6px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ddd;
            border-top-color: #4285f4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* レスポンシブ */
        @media (max-width: 400px) {
            .overlay-panel {
                max-width: none;
                width: calc(100vw - 20px);
                padding: 10px;
            }

            .btn {
                font-size: 12px;
                padding: 7px 4px;
            }
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="overlay-panel">
        <h1>
            旅の軌跡マップ
            <button class="toggle-btn" onclick="togglePanel()" title="パネルを開閉">▼</button>
        </h1>
        <div class="panel-body" id="panelBody">
            <!-- モード切り替え -->
            <div class="mode-btns">
                <button class="btn btn-route active" id="btnToday" onclick="switchMode('today')">今日のルート</button>
                <button class="btn btn-all" id="btnAll" onclick="switchMode('all')">全体の軌跡</button>
            </div>

            <!-- 入力欄 -->
            <div id="inputArea">
                <div class="input-group">
                    <label>A地点（出発地）</label>
                    <input type="text" id="inputFrom" placeholder="例：大阪駅">
                </div>
                <div class="input-group">
                    <label>B地点（目的地）</label>
                    <input type="text" id="inputTo" placeholder="例：明石駅">
                </div>
                <div class="btn-row">
                    <button class="btn btn-primary" id="btnShowRoute" onclick="showRoute()">ルートを表示</button>
                    <button class="btn btn-success" id="btnSave" onclick="saveRoute()" disabled>記録する</button>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span style="font-size:12px; margin-left:6px;">読み込み中...</span>
            </div>

            <div class="info-text" id="infoText"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // ====================
        // グローバル変数
        // ====================
        let map;
        let directionsService;
        let directionsRenderer;
        let currentRoute = null;       // 現在表示中のルート情報
        let allPolylines = [];         // 全体の軌跡用polyline配列
        let currentMode = 'today';     // 'today' or 'all'

        // ====================
        // 地図初期化
        // ====================
        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 35.6812, lng: 139.7671 }, // 東京駅
                zoom: 6,
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false,
                zoomControlOptions: {
                    position: google.maps.ControlPosition.RIGHT_CENTER
                }
            });

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer({
                map: map,
                suppressMarkers: false,
                polylineOptions: {
                    strokeColor: '#FF0000',
                    strokeWeight: 5,
                    strokeOpacity: 0.8
                }
            });
        }

        // ====================
        // パネル開閉
        // ====================
        function togglePanel() {
            const body = document.getElementById('panelBody');
            const btn = document.querySelector('.toggle-btn');
            body.classList.toggle('collapsed');
            btn.textContent = body.classList.contains('collapsed') ? '▶' : '▼';
        }

        // ====================
        // モード切り替え
        // ====================
        function switchMode(mode) {
            currentMode = mode;
            const btnToday = document.getElementById('btnToday');
            const btnAll = document.getElementById('btnAll');
            const inputArea = document.getElementById('inputArea');

            btnToday.classList.toggle('active', mode === 'today');
            btnAll.classList.toggle('active', mode === 'all');

            if (mode === 'today') {
                inputArea.style.display = 'block';
                clearAllPolylines();
                if (currentRoute) {
                    directionsRenderer.setMap(map);
                }
                setInfo('A地点とB地点を入力してルートを表示してください。');
            } else {
                inputArea.style.display = 'none';
                directionsRenderer.setMap(null);
                loadAllRoutes();
            }
        }

        // ====================
        // ルート表示
        // ====================
        function showRoute() {
            const from = document.getElementById('inputFrom').value.trim();
            const to = document.getElementById('inputTo').value.trim();

            if (!from || !to) {
                setInfo('出発地と目的地を入力してください。', 'error');
                return;
            }

            showLoading(true);
            setInfo('');
            document.getElementById('btnSave').disabled = true;

            const request = {
                origin: from,
                destination: to,
                travelMode: google.maps.TravelMode.DRIVING
            };

            directionsService.route(request, function(result, status) {
                showLoading(false);

                if (status === 'OK') {
                    directionsRenderer.setMap(map);
                    directionsRenderer.setDirections(result);

                    const route = result.routes[0];
                    const leg = route.legs[0];
                    const distanceKm = (leg.distance.value / 1000).toFixed(1);
                    const encodedPolyline = route.overview_polyline;

                    currentRoute = {
                        from: leg.start_address,
                        to: leg.end_address,
                        fromName: from,
                        toName: to,
                        distance: distanceKm,
                        polyline: encodedPolyline
                    };

                    document.getElementById('btnSave').disabled = false;
                    setInfo(from + ' → ' + to + '（' + distanceKm + ' km）', 'success');
                } else {
                    currentRoute = null;
                    let msg = 'ルートが見つかりませんでした。';
                    if (status === 'NOT_FOUND') {
                        msg = '地点が見つかりません。地名を確認してください。';
                    } else if (status === 'ZERO_RESULTS') {
                        msg = 'この区間のルートが見つかりません。';
                    }
                    setInfo(msg, 'error');
                }
            });
        }

        // ====================
        // スプレッドシートに保存
        // ====================
        function saveRoute() {
            if (!currentRoute) return;

            showLoading(true);
            document.getElementById('btnSave').disabled = true;

            const today = new Date();
            const dateStr = today.getFullYear() + '/' +
                String(today.getMonth() + 1).padStart(2, '0') + '/' +
                String(today.getDate()).padStart(2, '0');

            const rowData = [
                dateStr,
                currentRoute.fromName,
                currentRoute.toName,
                currentRoute.distance,
                currentRoute.polyline
            ];

            const body = {
                values: [rowData]
            };

            const url = 'https://sheets.googleapis.com/v4/spreadsheets/' +
                CONFIG.SPREADSHEET_ID +
                '/values/' + CONFIG.SHEET_NAME + ':append' +
                '?valueInputOption=USER_ENTERED' +
                '&key=' + CONFIG.SHEETS_API_KEY;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('保存に失敗しました（HTTP ' + response.status + '）');
                }
                return response.json();
            })
            .then(function() {
                showLoading(false);
                setInfo('記録しました！（' + currentRoute.fromName + ' → ' + currentRoute.toName + '）', 'success');
            })
            .catch(function(err) {
                showLoading(false);
                setInfo('保存エラー: ' + err.message + '。APIキーとスプレッドシートの共有設定を確認してください。', 'error');
                document.getElementById('btnSave').disabled = false;
            });
        }

        // ====================
        // 全ルート読み込み・描画
        // ====================
        function loadAllRoutes() {
            showLoading(true);
            setInfo('');
            clearAllPolylines();

            const url = 'https://sheets.googleapis.com/v4/spreadsheets/' +
                CONFIG.SPREADSHEET_ID +
                '/values/' + CONFIG.SHEET_NAME +
                '?key=' + CONFIG.SHEETS_API_KEY;

            fetch(url)
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('データ取得に失敗しました（HTTP ' + response.status + '）');
                }
                return response.json();
            })
            .then(function(data) {
                showLoading(false);
                const rows = data.values;

                if (!rows || rows.length === 0) {
                    setInfo('記録されたルートがありません。', 'error');
                    return;
                }

                const bounds = new google.maps.LatLngBounds();
                let routeCount = 0;
                let totalDistance = 0;

                rows.forEach(function(row) {
                    // row: [日付, A地点, B地点, 距離, polyline]
                    const polylineStr = row[4];
                    if (!polylineStr) return;

                    const path = google.maps.geometry.encoding.decodePath(polylineStr);
                    if (path.length === 0) return;

                    const polyline = new google.maps.Polyline({
                        path: path,
                        strokeColor: '#FF0000',
                        strokeWeight: 4,
                        strokeOpacity: 0.7,
                        map: map
                    });

                    allPolylines.push(polyline);
                    path.forEach(function(point) {
                        bounds.extend(point);
                    });

                    routeCount++;
                    totalDistance += parseFloat(row[3]) || 0;
                });

                if (routeCount > 0) {
                    map.fitBounds(bounds);
                    setInfo('全 ' + routeCount + ' ルート（合計 ' + totalDistance.toFixed(1) + ' km）', 'success');
                } else {
                    setInfo('有効なルートデータがありません。', 'error');
                }
            })
            .catch(function(err) {
                showLoading(false);
                setInfo('読み込みエラー: ' + err.message, 'error');
            });
        }

        // ====================
        // ポリライン全消去
        // ====================
        function clearAllPolylines() {
            allPolylines.forEach(function(pl) {
                pl.setMap(null);
            });
            allPolylines = [];
        }

        // ====================
        // ユーティリティ
        // ====================
        function setInfo(msg, type) {
            const el = document.getElementById('infoText');
            el.textContent = msg;
            el.className = 'info-text';
            if (type) el.classList.add(type);
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        // Enterキーでルート表示
        document.addEventListener('DOMContentLoaded', function() {
            var inputs = document.querySelectorAll('#inputFrom, #inputTo');
            inputs.forEach(function(input) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') showRoute();
                });
            });
        });
    </script>

    <!-- Google Maps JavaScript API (geometry ライブラリ含む) -->
    <script>
        // config.js のキーを使って動的にスクリプトを読み込む
        (function() {
            var script = document.createElement('script');
            script.src = 'https://maps.googleapis.com/maps/api/js?key=' +
                CONFIG.MAPS_API_KEY +
                '&libraries=geometry&callback=initMap&language=ja';
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
